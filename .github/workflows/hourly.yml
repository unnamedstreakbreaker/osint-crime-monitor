name: OSINT crime brief - hourly update + deploy

on:
  schedule:
    # Two attempts an hour: GitHub runs schedules on a best-effort basis and often skips slots
    # on busy servers, so the second slot keeps the board at least hourly. Runs never overlap.
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: osint-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds and build brief
        env:
          OSINT_DB: data/osint_monitor.db
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OSINT_REFRESH_URL: ${{ vars.OSINT_REFRESH_URL }}
        run: python -m osint_monitor --out site/index.html --json-out site/incidents.json

      - name: Save history (SQLite) back to the repo
        run: |
          git config user.name "osint-bot"
          git config user.email "osint-bot@users.noreply.github.com"
          git add -f data/osint_monitor.db
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update history $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          echo "::warning::Could not save history this run; the site will still deploy."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
