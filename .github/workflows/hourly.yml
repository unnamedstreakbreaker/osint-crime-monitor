name: OSINT crime brief - hourly update + deploy

on:
  schedule:
    - cron: "17 * * * *"      # every hour (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: osint-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds and build brief
        env:
          OSINT_DB: data/osint_monitor.db
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m osint_monitor --out site/index.html --json-out site/incidents.json

      - name: Save history (SQLite) back to the repo
        run: |
          git config user.name "osint-bot"
          git config user.email "osint-bot@users.noreply.github.com"
          git add data/osint_monitor.db
          git diff --cached --quiet || (git commit -m "Update history $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
